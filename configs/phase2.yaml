phase: 2
environment: DoorKeyMazeEnv

maze:
  type: dynamic_door_key_grid
  level: small
  size: 10
  difficulty: medium
  seed: 42
  start: [0, 0]
  goal: bottom_right
  generation: phase1_obstacle_blocks_validated_chokepoint
  max_steps_factor: 4
  dynamic_objects: true
  n_dynamic_layouts: 4
  levels:
    tiny: 8
    small: 10
    medium: 20
    large: 50
  difficulties:
    easy:
      wall_density: 0.18
    medium:
      wall_density: 0.28
    hard:
      wall_density: 0.36

objects:
  key:
    placement: dynamic_dead_end_on_start_side
    encoding: 4
  door:
    placement: dynamic_chokepoint_on_start_goal_path
    locked_encoding: 5
    open_encoding: 6
    must_cut_all_start_goal_bypasses: true

observation:
  encoding:
    free: 0
    wall: 1
    agent: 2
    goal: 3
    key: 4
    door_locked: 5
    door_open: 6
  shape: "size * size + 2"
  flags: [has_key, door_open]

rewards:
  available: [sparse, subgoal, potential]
  default: sparse
  gamma: 0.99
  sparse:
    goal_reward: 1.0
    wall_penalty: 0.5
    step_penalty: 0.01
  subgoal:
    goal_reward: 1.0
    key_reward: 0.5
    door_reward: 0.3
    wall_penalty: 0.5
    step_penalty: 0.01
  potential:
    base: sparse
    gamma: 0.99

actions:
  0: up
  1: down
  2: left
  3: right

experiments:
  seeds: [0, 1, 2, 3, 4]
  algorithms: [dqn, ddqn, ppo]
  rewards: [sparse, subgoal, potential]

dqn:
  episodes: 10000
  lr: 0.001
  gamma: 0.99
  buffer_size: 50000
  batch: 64
  target_update: 500
  eps_start: 1.0
  eps_end: 0.05
  eps_decay: 0.995
  warmup: 1000
  hidden: [256, 128]

ppo:
  total_timesteps: 1000000
  lr: 0.0003
  n_steps: 4096
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
